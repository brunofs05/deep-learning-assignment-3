[project]
name = "pa3"
version = "0.1.0"
description = "PA3 — Poucos rótulos: fauna em câmeras trap"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "timm>=1.0",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pillow>=10",
    "tqdm>=4.66",
    "gdown>=5.2",
]

[project.optional-dependencies]
teacher = ["open_clip_torch>=2.26"]
cam = ["grad-cam>=1.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pa3"]

# torch cu126: último build com suporte a Pascal (GTX 1080 Ti, sm_61)
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
